services:
  postgres:
    image: postgres:16-alpine
    container_name: gp-postgres
    environment:
      POSTGRES_USER: gp_user
      POSTGRES_PASSWORD: gp_password
      POSTGRES_DB: gp_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gp_user -d gp_platform']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
